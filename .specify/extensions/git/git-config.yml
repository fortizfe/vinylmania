# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Commit message used by `git commit` during repository initialization
init_commit_message: "[Spec Kit] Initial commit"

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
#
# Messages follow Conventional Commits. Two placeholders are expanded by
# auto-commit.sh from .specify/feature.json (falling back to the branch name):
#   {scope} -> feature number, e.g. 069   ("spec" when there is no number)
#   {name}  -> feature slug,   e.g. jira-speckit-hooks
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "chore({scope}): save progress before clarification"
  before_plan:
    enabled: false
    message: "chore({scope}): save progress before planning"
  before_tasks:
    enabled: false
    message: "chore({scope}): save progress before task generation"
  before_implement:
    enabled: false
    message: "chore({scope}): save progress before implementation"
  before_checklist:
    enabled: false
    message: "chore({scope}): save progress before checklist"
  before_analyze:
    enabled: false
    message: "chore({scope}): save progress before analysis"
  before_taskstoissues:
    enabled: false
    message: "chore({scope}): save progress before issue sync"
  after_constitution:
    enabled: true
    message: "docs(constitution): update project constitution"
  after_specify:
    enabled: true
    message: "docs({scope}): add spec for {name}"
  after_clarify:
    enabled: true
    message: "docs({scope}): clarify spec for {name}"
  after_plan:
    enabled: true
    message: "docs({scope}): add implementation plan"
  after_tasks:
    enabled: true
    message: "docs({scope}): add task breakdown"
  after_implement:
    enabled: true
    message: "feat({scope}): implement {name}"
  after_checklist:
    enabled: true
    message: "docs({scope}): add checklist"
  after_analyze:
    enabled: true
    message: "docs({scope}): add analysis report"
  after_taskstoissues:
    enabled: true
    message: "chore({scope}): sync tasks to issues"

# Pull request creation via `gh` (invoked by speckit.git.pr, e.g. as the
# optional after_implement hook).
auto_pr:
  draft: false      # Open the PR as a draft
  base: ""          # Target branch; blank = repository default branch
  title: ""         # PR title; blank = derived from spec.md heading / branch name
