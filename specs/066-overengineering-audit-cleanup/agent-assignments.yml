# Agent Assignments
# Feature: 066-overengineering-audit-cleanup (Over-engineering Audit Cleanup)
# Generated: 2026-09-18
# Command: /speckit.agent-assign.assign

agents_scanned:
  - name: "backend-agent"
    source: "project"
    description: "Work under backend/ — Express + TypeScript, hexagonal architecture, Firebase Admin, Discogs, Redis; TDD, YAGNI, SOLID, KISS"
  - name: "docs-agent"
    source: "project"
    description: "End-user documentation for Vinylmania (manuals, guides, FAQs)"
  - name: "frontend-agent"
    source: "project"
    description: "Work under frontend/ — React 19 + TypeScript (Vite), Tailwind v4, TanStack Query; WCAG 2.1 AA; TDD via Vitest + RTL"
  - name: "qa-agent"
    source: "project"
    description: "Test-First/TDD discipline and test quality across backend, frontend and e2e; flaky/failing test fixes"

