agents_scanned:
  - name: "architect-agent"
    source: "project"
    description: "Use to design how a Vinylmania feature should be structured before code is written — during the spec-kit phases (specify, clarify, plan, tasks) and at the start of implementation when the structure isn't settled yet. Decides where code lives (backend hexagonal layers, frontend components/hooks), data models, contracts, and task breakdown, always climbing the ponytail ladder for the smallest design that works and using the Apple design skills when the feature has UI or interaction. Writes spec artifacts (spec.md, plan.md, research.md, data-model.md, contracts/, tasks.md), never source code — implementation goes to backend-agent / frontend-agent / qa-agent."
  - name: "backend-agent"
    source: "project"
    description: "Use for any work under backend/ — Express.js + TypeScript APIs, hexagonal architecture (domain/application/ports/adapters), Firebase Admin/Firestore, Discogs API client, Redis caching. Enforces TDD, YAGNI, SOLID, and KISS on every change. Do NOT use for frontend/ or e2e/ work — hand those to frontend-agent or qa-agent instead."
  - name: "docs-agent"
    source: "project"
    description: "Use for end-user documentation for Vinylmania — user manuals, getting-started guides, feature walkthroughs, and FAQs written for collectors using the app, not for developers. Use when writing or updating docs/ content aimed at end users, onboarding material, or in-app help copy. Not for developer/API docs, specs/, or code changes — those stay with backend-agent, frontend-agent, or qa-agent."
  - name: "frontend-agent"
    source: "project"
    description: "Use for any work under frontend/ — React 19 + TypeScript (Vite), Tailwind CSS v4, TanStack Query. Builds every interface with the installed Apple design skills and strictly enforces WCAG 2.1 AA accessibility, with TDD via Vitest + React Testing Library. Applies YAGNI, SOLID, KISS. Do NOT use for backend/ or e2e/ work — hand those to backend-agent or qa-agent instead."
  - name: "qa-agent"
    source: "project"
    description: "Use for enforcing Test-First/TDD discipline and overall test quality across the whole Vinylmania codebase (backend, frontend, e2e). Reviews whether tests were written before implementation, audits coverage and test quality, fixes flaky/failing tests, and gates changes against the constitution's Test-First principle and quality gates. Use for TDD/quality audits and test work, not for feature implementation itself — that's backend-agent or frontend-agent's job."
  - name: "reviewer-agent"
    source: "project"
    description: "Use to code-review a pull request (MR) in the Vinylmania repo and post the results as comments on it. Give it a PR number, URL, or branch; with nothing, it reviews the PR of the current branch. Mandatorily runs the installed ponytail skills (ponytail-review, ponytail-debt) plus a correctness pass, then leaves one GitHub review with inline comments. Read-only on code — it never edits, commits, approves, or merges."

