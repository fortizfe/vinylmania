    description: "Use for any work under frontend/ — React 19 + TypeScript (Vite), Tailwind CSS v4, TanStack Query. Builds every interface with the installed Apple design skills and strictly enforces WCAG 2.1 AA accessibility, with TDD via Vitest + React Testing Library. Do NOT use for backend/ or e2e/ work — hand those to backend-agent or qa-agent instead."
  - name: "qa-agent"
    source: "project"
    description: "Use for enforcing Test-First/TDD discipline and overall test quality across the whole Vinylmania codebase (backend, frontend, e2e). Reviews whether tests were written before implementation, audits coverage and test quality, fixes flaky/failing tests, and gates changes against the constitution's Test-First principle and quality gates."

