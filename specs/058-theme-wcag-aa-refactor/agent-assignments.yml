agents_scanned:
  - name: "backend-agent"
    source: "project"
    description: "Use for any work under backend/ — Express.js + TypeScript APIs, hexagonal architecture (domain/application/ports/adapters), Firebase Admin/Firestore, Discogs API client, Redis caching. Enforces TDD, YAGNI, SOLID, and KISS on every change. Do NOT use for frontend/ or e2e/ work — hand those to frontend-agent or qa-agent instead."
  - name: "docs-agent"
    source: "project"
    description: "Use for end-user documentation for Vinylmania — user manuals, getting-started guides, feature walkthroughs, and FAQs written for collectors using the app, not for developers. Not for developer/API docs, specs/, or code changes."
  - name: "frontend-agent"
    source: "project"
    description: "Use for any work under frontend/ — React 19 + TypeScript (Vite), Tailwind CSS v4, TanStack Query. Builds every interface with the installed Apple design skills and strictly enforces WCAG 2.1 AA accessibility, with TDD via Vitest + React Testing Library. Applies YAGNI, SOLID, KISS. Do NOT use for backend/ or e2e/ work."
  - name: "qa-agent"
    source: "project"
    description: "Use for enforcing Test-First/TDD discipline and overall test quality across the whole Vinylmania codebase (backend, frontend, e2e). Reviews whether tests were written before implementation, audits coverage and test quality, fixes flaky/failing tests, and gates changes against the constitution's Test-First principle and quality gates."

